function ip(dl,vu){vd=dl;vf=0;vp=false;var vv=document.getElementById("vv");var cv=document.getElementById("vcv");var nt=document.getElementById("vidNote");if(vu&&vu.length>0){if(vv){vv.src=vu;vv.style.display="block";if(cv)cv.style.display="none";if(nt)nt.textContent="正在播放原素材视频";}var o=document.getElementById("vov");if(o)o.style.display="none";var ctrl=document.querySelector(".vc");if(ctrl)ctrl.style.display="none";return;}if(vv)vv.style.display="none";if(cv)cv.style.display="block";if(nt)nt.textContent="效果回放（原素材视频需手动填入video_url）";var s=document.getElementById("vsk");if(s){s.max=dl.length-1;s.value=0;}var t=document.getElementById("vtm");if(t)t.textContent="0/"+dl.length;var b=document.getElementById("pbt");if(b)b.textContent="▶";var o=document.getElementById("vov");if(o)o.style.display="flex";dw(0);}

function sp(v){vf=parseInt(v);var t=document.getElementById("vtm");if(t)t.textContent=(vf+1)+"/"+vd.length;dw(vf);}
function dw(i){
  var cv=document.getElementById("vcv");if(!cv||!vd)return;var d=vd[i];var ctx=cv.getContext("2d");
  var p=cv.parentElement;var W=p.clientWidth||800;var H=p.clientHeight||450;cv.width=W;cv.height=H;
  var bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#0f172a");bg.addColorStop(1,"#1e293b");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#f1f5f9";ctx.font="bold 26px -apple-system,sans-serif";ctx.textAlign="center";ctx.fillText(d.date,W/2,H*.15);
  var ms=Math.max.apply(null,vd.map(function(x){return x.spend}));
  var mi=Math.max.apply(null,vd.map(function(x){return x.impressions}));
  var mc=Math.max.apply(null,vd.map(function(x){return x.clicks}));
  var mo=Math.max.apply(null,vd.map(function(x){return x.orders}));
  var mt=[{l:"消耗",v:d.spend,mx:ms||1,c:"#3b82f6",f:function(v){return"¥"+v.toLocaleString()}},{l:"展示量",v:d.impressions,mx:mi||1,c:"#8b5cf6",f:function(v){return(v/1000).toFixed(1)+"k"}},{l:"点击量",v:d.clicks,mx:mc||1,c:"#f59e0b",f:function(v){return v.toLocaleString()}},{l:"订单数",v:d.orders,mx:mo||1,c:"#10b981",f:function(v){return v.toLocaleString()}}];
  var bh=34,g=14,sy=H*.3;
  mt.forEach(function(m,j){var y=sy+j*(bh+g);var bw=(m.v/m.mx)*(W*.5);ctx.fillStyle="#94a3b8";ctx.font="12px -apple-system,sans-serif";ctx.textAlign="right";ctx.fillText(m.l,W*.22,y+bh/2+4);ctx.fillStyle="#1e293b";ctx.fillRect(W*.25,y,W*.55,bh);ctx.fillStyle=m.c;ctx.fillRect(W*.25,y,bw,bh);ctx.fillStyle="#f1f5f9";ctx.font="bold 13px -apple-system,sans-serif";ctx.textAlign="left";ctx.fillText(m.f(m.v),W*.25+bw+10,y+bh/2+4)});
  ctx.fillStyle="#64748b";ctx.font="10px -apple-system,sans-serif";ctx.textAlign="center";ctx.fillText("投放效果回放 · 每1.2秒/天",W/2,H*.92);
}
